<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bug Report Manager | Bryan Adrian</title><meta name="description" content="Gerenciador de bugs com persistência local."><link rel="stylesheet" href="../../assets/css/style.css"></head><body><header class="top"><div class="w nav"><a class="logo" href="../../index.html">&larr; bryan<b>.dev</b></a><span class="m" style="font-size:14px">Bug Report Manager</span></div></header><main class="w app">
<div class="g2" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><form class="card" id="f" novalidate><h3 id="ft">Novo bug</h3>
<label for="t">Título *</label><input id="t" maxlength="100"><label for="d">Descrição *</label><textarea id="d" rows="3"></textarea>
<label for="sv">Severidade</label><select id="sv"><option value="baixa">Baixa</option><option value="media" selected>Média</option><option value="alta">Alta</option><option value="critica">Crítica</option></select>
<label for="pr">Prioridade</label><select id="pr"><option value="baixa">Baixa</option><option value="media" selected>Média</option><option value="alta">Alta</option></select>
<label for="st">Status</label><select id="st"><option value="aberto">Aberto</option><option value="andamento">Em andamento</option><option value="resolvido">Resolvido</option></select>
<div class="err" id="err" role="alert"></div><div class="row"><button class="btn p">Salvar</button><button class="btn" type="button" id="cn" hidden>Cancelar</button></div></form>
<div class="card"><div class="row"><input id="q" placeholder="Pesquisar por título" aria-label="Pesquisar" style="flex:2"><select id="fs" aria-label="Status" style="flex:1"><option value="">Todos status</option><option value="aberto">Aberto</option><option value="andamento">Em andamento</option><option value="resolvido">Resolvido</option></select><select id="fv" aria-label="Severidade" style="flex:1"><option value="">Toda severidade</option><option value="baixa">Baixa</option><option value="media">Média</option><option value="alta">Alta</option><option value="critica">Crítica</option></select></div><div id="ls" aria-live="polite"></div></div></div>
</main><script src="../../assets/js/chart.js"></script><script src="app.js"></script></body></html>
